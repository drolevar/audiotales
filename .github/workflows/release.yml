name: Signed Android release build

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out tagged source and version history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and version order
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_version.py --tag "$RELEASE_TAG" --check-tags --github-output "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          python3 -m unittest discover -s scripts -p release_test.py -v

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          tools_archive="$RUNNER_TEMP/android-commandline-tools.zip"
          tools_directory="$RUNNER_TEMP/audiotales-android-tools"
          curl --fail --location --retry 3 \
            --output "$tools_archive" \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          echo "0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  $tools_archive" | sha256sum --check
          unzip -q "$tools_archive" -d "$tools_directory"
          set +o pipefail
          yes | "$tools_directory/cmdline-tools/bin/android" --no-metrics --sdk="$ANDROID_HOME" \
            sdk install platforms/android-37.0 build-tools/36.0.0

      - name: Build, lint, and test unsigned release
        env:
          AUDIOTALES_RELEASE_TAG: ${{ github.ref_name }}
          AUDIOTALES_PARTNER_CLIENT_QUERY: ${{ secrets.AUDIOTALES_PARTNER_CLIENT_QUERY }}
        # AGP 9 creates local JVM tests only for the tested (debug) build type.
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:lintRelease :app:testDebugUnitTest

      - name: Sign and verify release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          PARTNER_CONFIGURED: ${{ secrets.AUDIOTALES_PARTNER_CLIENT_QUERY != '' }}
        run: |
          set -euo pipefail
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_SIGNER; do
            if [[ -z "${!name}" ]]; then
              echo "Required release configuration is missing: $name" >&2
              exit 1
            fi
          done
          signing_directory="$(mktemp -d "$RUNNER_TEMP/audiotales-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_directory"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_directory/release.keystore"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir release-artifacts
          apk="release-artifacts/audiotales-$RELEASE_VERSION.apk"
          "$build_tools/apksigner" sign \
            --ks "$signing_directory/release.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/mapping/release/mapping.txt release-artifacts/mapping.txt
          python3 scripts/release_verify.py --apk "$apk" --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" --expected-signer "$EXPECTED_SIGNER" --build-tools "$build_tools" \
            --mapping release-artifacts/mapping.txt --partner-configured "$PARTNER_CONFIGURED" \
            --output release-artifacts/provenance.json
          (
            cd release-artifacts
            sha256sum "audiotales-$RELEASE_VERSION.apk" mapping.txt provenance.json > SHA256SUMS
          )

      - name: Upload verified signed APK and provenance
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audiotales-${{ steps.version.outputs.version_name }}-${{ github.sha }}
          # apksigner can also emit an .apk.idsig sidecar; distribute only this bundle.
          path: |
            release-artifacts/audiotales-${{ steps.version.outputs.version_name }}.apk
            release-artifacts/mapping.txt
            release-artifacts/provenance.json
            release-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publishing tools from the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require an exact build artifact ID
        env:
          ARTIFACT_ID: ${{ needs.release.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download the verified artifact from this build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: release-artifacts
          digest-mismatch: error

      - name: Stage, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          python3 scripts/release_publish.py --artifacts release-artifacts \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --expected-signer "$EXPECTED_SIGNER"
